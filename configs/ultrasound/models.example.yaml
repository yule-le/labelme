schema_version: ultrasound_models.v1

# Copy this file to models.local.yaml and replace the paths with the published
# artifacts on the local machine. models.local.yaml is intentionally ignored.
# Optional local directory initially shown by Labelme's Open Folder dialog.
annotation_root: null

models:
  eye_muscle:
    model_id: seg_eye_muscle
    artifact_id: seg_eye_muscle__transverse__v1
    export_label: EMA
    weights_path: null
    config_path: null
    threshold: 0.50
    min_component_area: 64
    polygon_tolerance: 1.5
    roi:
      raw_size_wh: [800, 600]
      rectangle_xywh: [92, 31, 536, 536]
      accept_cropped_size: true
      # Prepared ROI batches may use different crop templates and dimensions.
      accept_variable_cropped_size: true

  # This is a separate model, not a channel from the experimental
  # seg_multilabel artifact.
  skin:
    model_id: seg_skin
    artifact_id: seg_skin__transverse__v1
    export_label: skin
    weights_path: null
    config_path: null
    threshold: 0.50
    min_component_area: 64
    polygon_tolerance: 1.5
    roi:
      raw_size_wh: [800, 600]
      rectangle_xywh: [92, 31, 536, 536]
      accept_cropped_size: true
      accept_variable_cropped_size: true
